name: 一键出APK
on: [push, workflow_dispatch]
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 查看仓库文件
        run: |
          echo "== 根目录 =="
          ls -la
          echo "== 全部zip =="
          ls -la *.zip 2>/dev/null || echo "没有zip"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 解压并编译
        run: |
          for Z in *.zip; do
            [ -f "$Z" ] || continue
            echo "正在解压: $Z"
            unzip -o "$Z" -d src || true
          done
          echo "== src 内容 =="
          ls -la src 2>/dev/null || echo "src不存在"
          echo "== 查找 gradlew =="
          find . -name gradlew 2>/dev/null | head
          D=$(dirname $(find . -name gradlew 2>/dev/null | head -1) 2>/dev/null || echo "")
          if [ -n "$D" ] && [ "$D" != "." ]; then
            echo "工程目录: $D"
            cd "$D"
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon || true
          else
            echo "未找到 gradlew，跳过编译"
          fi
          mkdir -p out
          find . -name "*.apk" -exec cp {} out/ \; 2>/dev/null || true
          echo "== 收集到的APK =="
          ls -la out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 商店APP
          path: out
