name: 一键出APK
on: [push, workflow_dispatch]
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 查看仓库文件
        run: |
          echo "== 根目录 =="
          ls -la
          echo "== 所有zip =="
          find . -name "*.zip" | head
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 解压并编译
        run: |
          Z=$(find . -maxdepth 2 -name "*.zip" | head -1)
          echo "找到压缩包: $Z"
          if [ -n "$Z" ]; then unzip -o "$Z" -d src; fi
          echo "== src 目录 =="
          ls -la src 2>/dev/null || true
          echo "== 查找 gradlew =="
          find . 
